<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ tools</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#9a9a9a; --line:#333; --accent:#8ab4f8; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; max-width:42rem; margin:0 auto; padding:3rem 1rem; }
  h1 { margin:0 0 .25rem; }
  p.lede { color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); padding:1rem 0; }
  li:last-child { border-bottom:1px solid var(--line); }
  a { color:var(--accent); font-weight:600; }
  li span { display:block; color:var(--muted); }
</style>
</head>
<body>
<h1>DJ tools</h1>
<p class="lede">Small, self-contained tools for DJs. Source on <a href="https://github.com/puppi3-music/puppi3s-dj-tools">GitHub</a>.</p>
<ul>
  <li><a href="track-analyzer/">Puppi3's Track Analyzer guide</a><span>BPM, key, subgenre, mood and hype score, synced into Traktor Pro 4.</span></li>
</ul>
</body>
</html>
