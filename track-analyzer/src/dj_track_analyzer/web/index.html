<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppi3's Track Analyzer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e2e1dc; --line-strong: #c9c8c1;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7b7a74;
  --accent: #2a78d6; --accent-soft: #dce9f9; --bar: #2a78d6; --bar-2: #9cc0ec;
  --good: #0a7d32; --warn: #a15c00; --bad: #c0322f;
  --c-red: #e5312f; --c-orange: #f08a24; --c-yellow: #e8c51c; --c-green: #3fae49;
  --c-blue: #2e7fd8; --c-violet: #8a4fd6; --c-magenta: #d63a9c;
  --radius: 10px; --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --line: #2e2e2b; --line-strong: #45443f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #5b9ef0; --accent-soft: #1d2f47; --bar: #3987e5; --bar-2: #2a4f7c;
    --good: #4cc477; --warn: #e3a33b; --bad: #ef6b68;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --line: #2e2e2b; --line-strong: #45443f;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #5b9ef0; --accent-soft: #1d2f47; --bar: #3987e5; --bar-2: #2a4f7c;
  --good: #4cc477; --warn: #e3a33b; --bad: #ef6b68;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 20px; margin-bottom: 4px; overflow-wrap: anywhere; }
h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }

header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
.brand span { color: var(--text-3); font-weight: 500; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-weight: 500; }
nav a:hover { background: var(--surface-2); text-decoration: none; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
select, input, button { font: inherit; color: inherit; }
select, input[type=text], input[type=number], input[type=search] {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 8px; min-width: 0; }
input[type=number] { width: 80px; }
button { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--text-3); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.btn { display: inline-block; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 12px; color: var(--text); white-space: nowrap; }
a.btn:hover { border-color: var(--text-3); text-decoration: none; }
nav a .count { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
nav a.on .count { color: inherit; opacity: .75; }
label.inline { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.libnote { padding: 6px 20px; font-size: 12px; background: var(--surface-2); color: var(--text-2); border-top: 1px solid var(--line); }
.libnote b { color: var(--text); }
#loaded { display: inline-flex; gap: 6px; flex-wrap: wrap; color: inherit; }
#loaded[hidden] { display: none; }
#loaded:hover { text-decoration: none; }
#loaded:hover .chip { border-color: var(--text-3); }

main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card + .card, .card + .grid, .grid + .card, .grid + .grid, .tiles + .card { margin-top: 16px; }
.grid > .card, .grid > div > .card:first-child { margin-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--radius); padding: 10px 14px 12px; }
.tile.bad { border-top-color: var(--bad); } .tile.good { border-top-color: var(--good); }
.tile.bad .v { color: var(--bad); }
.tile.go { cursor: pointer; } .tile.go:hover { border-color: var(--text-3); }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--text-2); }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.err { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line));
  color: var(--text); padding: 12px 14px; border-radius: var(--radius); white-space: pre-wrap; }
.loading { color: var(--text-3); padding: 24px 0; display: flex; align-items: center; gap: 8px; }
.loading::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
.empty { text-align: center; padding: 32px 20px; color: var(--text-2); }
.empty .et { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.empty .eb { max-width: 520px; margin: 0 auto; }
.empty .ea { margin-top: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); font-size: 12px; white-space: nowrap; }
.fchip button { padding: 0 6px; font-size: 11px; line-height: 16px; border-radius: 99px; }
.note { font-size: 12px; color: var(--text-2); margin-top: 8px; }

/* bar lists */
.bars { display: grid; grid-template-columns: minmax(80px, max-content) 1fr auto; gap: 4px 10px; align-items: center; }
.bars .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; display: flex; align-items: center; gap: 6px; }
.bars .track { height: 14px; position: relative; }
.bars .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .val { color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12px; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 160px; padding-top: 6px; border-bottom: 1px solid var(--line-strong); }
.cols .c { flex: 1; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.cols .c:hover, .bars .row-h:hover .fill { background: var(--accent); filter: brightness(1.15); }
.bars .go, .cols .go { cursor: pointer; }
.bars .lab.go:hover { color: var(--accent); }
.cols-x { display: flex; gap: 2px; font-size: 11px; color: var(--text-3); }
.cols-x span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }

/* colour swatches */
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; vertical-align: -1px; }
.sw.pred { background: transparent !important; border: 2px dashed currentColor; }
.sw-Red { background: var(--c-red); color: var(--c-red); } .sw-Orange { background: var(--c-orange); color: var(--c-orange); }
.sw-Yellow { background: var(--c-yellow); color: var(--c-yellow); } .sw-Green { background: var(--c-green); color: var(--c-green); }
.sw-Blue { background: var(--c-blue); color: var(--c-blue); } .sw-Violet { background: var(--c-violet); color: var(--c-violet); }
.sw-Magenta { background: var(--c-magenta); color: var(--c-magenta); }
.colour { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--text); }
th.sort.asc::after { content: " ▲"; font-size: 9px; } th.sort.desc::after { content: " ▼"; font-size: 9px; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }
.trk { min-width: 220px; }
.trk .t { font-weight: 500; }
.trk .a { color: var(--text-2); font-size: 12px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; white-space: nowrap; }
.chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.lock { display: inline-flex; vertical-align: -2px; color: var(--text-2); margin-left: 4px; }
.selbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 10px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
.holds { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
td.cb, th.cb { width: 28px; padding-right: 0; }
.wavewrap { position: relative; background: #0c0c0e; border-radius: 8px; padding: 0; overflow: hidden; }
.wavewrap canvas { display: block; width: 100%; height: 206px; cursor: crosshair; }
.gridwave { position: relative; background: #0c0c0e; border-radius: 8px; overflow: hidden; margin-top: 8px; }
.gridwave canvas { display: block; width: 100%; height: 150px; }
.playhead { position: absolute; top: 22px; height: 110px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.8);
  pointer-events: none; display: none; }
.playhead.ov { top: 170px; height: 32px; box-shadow: none; }
.deck { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.deck .time { font-family: var(--mono); font-size: 13px; min-width: 210px; }
.deck .vol { display: inline-flex; align-items: center; gap: 6px; }
.deck .vol input { width: 90px; accent-color: var(--accent); }
.pads { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 8px; font-size: 12px; }
.pads button { padding: 3px 8px; font-size: 12px; }
/* your cue pads: solid in the text colour (white in dark, as on the waveform; black in light) */
.pads button.mine { background: var(--text); color: var(--surface); border-color: var(--text); font-weight: 700; min-width: 28px; }
.pads button.mine.new { background: #4cd17a; border-color: #4cd17a; color: #111; }
.pads button.mine.pend { background: transparent; color: var(--good); border: 1px dashed var(--good); }
.pads button.mine.del { background: transparent; color: var(--bad); border: 1px dashed var(--bad); text-decoration: line-through; }
.pads .pad { position: relative; display: inline-flex; }
.pads .padx { position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; padding: 0; font-size: 9px; line-height: 13px; border-radius: 50%;
  border: 1px solid #555; background: #1b1b1f; color: #ddd; opacity: 0; }
.pads .pad:hover .padx, .pads .padx:focus-visible, .pads .mine.del + .padx { opacity: 1; }
.pads .padx:hover { color: #ff786e; border-color: #ff786e; }
.pads button.mine.pend.nofit, .pads button.mine.new.nofit { color: var(--bad); border-color: var(--bad); }
.pads button.mine.new.nofit { background: transparent; }
.pads button.sug { border-color: #6fb4ff; }
.pads button.lp { border-color: #f08a24; }
.pads button.on { background: #f08a24; color: #111; }
.apgroup { margin: 10px 0 4px; }
dialog.write { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--text); padding: 18px 20px;
  width: min(640px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,.3); }
dialog.write::backdrop { background: rgba(0,0,0,.35); }
dialog.write h3 { margin: 0 0 8px; }
dialog.write ul { margin: 6px 0; padding-left: 18px; font-size: 12px; max-height: 260px; overflow-y: auto; }
label.approved { background: color-mix(in srgb, var(--good) 10%, transparent); border-radius: 6px; }
.apgroup h4 { margin: 0 0 4px; font-size: 13px; }
.fixbox { border-left: 3px solid #ffd23f; background: color-mix(in srgb, #ffd23f 9%, transparent); border-radius: 0 8px 8px 0; padding: 8px 10px; }
.fixbox .fix { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, #ffd23f 25%, transparent); }
.fixbox .fix:last-child { border-bottom: 0; }
#approve button.useas { font-size: 12px; padding: 1px 6px; margin-left: 4px; }
.usemenu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 4px; font-size: 12px; max-height: 50vh; overflow-y: auto; }
.usemenu div { padding: 4px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.usemenu div:hover, .usemenu div.on { background: var(--accent-soft); }
.fixbox select.target { font-size: 12px; padding: 1px 4px; max-width: 100%; }
#approve select.slot { font-size: 12px; padding: 1px 4px; }
#approve label.add { display: flex; align-items: flex-start; gap: 6px; margin: 3px 0; padding: 4px 6px; }
#approve label.add input { margin-top: 3px; }
#approve label.add > span > div:first-child > .mini { margin: 0 6px 0 0; }
#approve label.del { display: flex; align-items: center; gap: 6px; margin: 3px 0; padding: 3px 6px; }
#approve label.del .mini { margin: 0 6px 0 0; }
#approve label.add .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 3px; }
#approve label.add .ctl:empty { display: none; }
.fixbox .move { font-weight: 650; font-size: 14px; }
.fixbox .why { font-size: 12px; color: var(--text-2); }
button.mini { padding: 0 6px; font-size: 11px; margin-left: 6px; line-height: 18px; }
button.mini.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.wavehl { position: absolute; top: 22px; height: 108px; background: rgba(255,255,255,.16); border-left: 1px solid rgba(255,255,255,.6);
  pointer-events: none; display: none; }
.cuestrip svg { width: 100%; height: auto; display: block; overflow: visible; }
.cuestrip .lbl { font: 11px system-ui, sans-serif; fill: var(--text-2); }
.hype { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; font-weight: 650; font-variant-numeric: tabular-nums; padding: 0 4px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0,0,0,.18); z-index: 40; overflow-y: auto; padding: 20px; transform: translateX(105%); transition: transform .18s ease; }
.drawer.open { transform: none; }
.drawer { transition: transform .18s ease, width .18s ease; }
.drawer.wide { width: min(1100px, 100vw); }
.drawer-head { position: sticky; top: -20px; z-index: 5; display: flex; align-items: flex-start; gap: 10px; background: var(--surface);
  margin: -20px -20px 0; padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
.drawer-head > div:first-child { flex: 1; min-width: 0; }
.drawer-head .acts { display: flex; gap: 6px; flex: none; }
details.help { margin-top: 6px; }
details.help > summary { cursor: pointer; font-size: 12px; color: var(--text-2); width: max-content; }
details.help[open] > summary { margin-bottom: 4px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 12px 0; }
.facts dt { color: var(--text-2); }
.facts dd { margin: 0; }
.section { margin-top: 18px; }
.scale { display: grid; grid-template-columns: repeat(7, 1fr); position: relative; height: 26px; border-radius: 6px; overflow: hidden; }
.scale div { height: 100%; }
.scale-marks { position: relative; height: 34px; margin-top: 2px; }
.scale-marks .m { position: absolute; transform: translateX(-50%); font-size: 11px; text-align: center; white-space: nowrap; }
.scale-marks .m::before { content: ""; display: block; width: 2px; height: 8px; margin: 0 auto 1px; background: var(--text); }
.scale-marks.top { height: 22px; margin: 0 0 2px; }
.scale-marks.top .m::before { display: none; }
.scale-marks.top .m::after { content: ""; display: block; width: 2px; height: 6px; margin: 1px auto 0; background: var(--text); }

/* mixes */
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.split > * { min-width: 0; }
.list a > div { overflow-wrap: anywhere; }
.list a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--text); }
.list a:hover { background: var(--surface-2); text-decoration: none; }
.list a.on { background: var(--accent-soft); }
.list .k { font-size: 11px; color: var(--text-3); }
.timeline { display: flex; gap: 2px; align-items: flex-end; height: 120px; }
.timeline .seg { flex: 1; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
.timeline .seg:hover { background: var(--accent); filter: brightness(1.15); }
.timeline .seg.hl { background: var(--c-orange); }
.tl-x { display: flex; gap: 2px; font-size: 10px; color: var(--text-3); margin-top: 3px; }
.tl-x span { flex: 1; text-align: left; overflow: hidden; white-space: nowrap; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
textarea { width: 100%; min-height: 220px; font-family: var(--mono); font-size: 12px; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--text-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

/* json tree */
.tree { font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
.tree details { margin-left: 14px; }
.tree summary { cursor: pointer; margin-left: -14px; }
.tree .kv { margin-left: 0; }
.tree .key { color: var(--accent); }
.tree .s { color: var(--good); } .tree .n { color: var(--warn); } .tree .b { color: var(--c-violet); }

/* heat cells */
.heat td.h { text-align: right; font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; gap: 1px; background: var(--surface); min-width: 120px; }
.stack div { height: 100%; }

#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--text); color: var(--surface); padding: 5px 8px; border-radius: 6px;
  font-size: 12px; max-width: 320px; white-space: pre-line; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

/* setup + jobs */
nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 1px; }
.banner { padding: 8px 20px; font-size: 13px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-top: 1px solid var(--line); }
.jobbar { display: flex; gap: 10px; align-items: center; padding: 6px 20px; font-size: 12px; background: var(--accent-soft); border-top: 1px solid var(--line); flex-wrap: wrap; }
.jobbar .progress { width: 160px; }
.jobbar[hidden], .banner[hidden] { display: none; }
.jobbar button { padding: 1px 10px; font-size: 12px; }
.jobbar.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.jobbar.good { background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.progress { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; flex: none; }
.progress div { height: 100%; background: var(--accent); transition: width .4s; }
.progress.indet div { width: 30%; animation: indet 1.4s infinite linear; }
@keyframes indet { from { margin-left: -30%; } to { margin-left: 100%; } }
/* loop ideas while Demucs listens to them: a spinner by the note, and the buttons' orange edges breathe */
.parts-wait { display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; }
.parts-wait::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line-strong);
  border-top-color: var(--c-orange); animation: spin .8s linear infinite; }
.parts-wait.failed::before { display: none; }
.parts-wait[hidden] { display: none; }
#dk-play.waiting { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: progress; }
#dk-play.waiting::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff; animation: spin .8s linear infinite; }
#loop-pads.listening button.lp { animation: breathe 1.6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { border-color: var(--line); } }
@media (prefers-reduced-motion: reduce) { .parts-wait::before, #loop-pads.listening button.lp, #dk-play.waiting::before, .loading::before { animation: none; } }
pre.log { max-height: 280px; overflow: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; }
.steps { display: grid; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.step:first-child { padding-top: 4px; }
.step:last-child { border-bottom: 0; padding-bottom: 0; }
.step .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--line-strong); color: var(--text-3); }
.step.done .ic { background: var(--good); border-color: var(--good); color: #fff; }
.step.todo .ic { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step.blocked > div:nth-child(2) { opacity: .7; }
.step .st { font-weight: 600; }
.step > div { min-width: 0; overflow-wrap: anywhere; }
.step .act { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; max-width: 460px; }
.step .act input[type=text] { width: 230px; }
button:disabled { opacity: .5; cursor: default; }
dialog.write .warnbox, #gridbox .warnbox { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line));
  border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }

#lib { max-width: 220px; }
@media (max-width: 760px) {
  .step { grid-template-columns: 26px minmax(0, 1fr); }
  .step .act label.inline { white-space: normal; }
  .step .act { grid-column: 2; justify-content: flex-start; max-width: none; }
  .step .act input[type=text] { width: 100%; }
  .banner, .jobbar { padding: 6px 16px; }
  .bar-top { padding: 10px 16px; gap: 8px; }
  nav { flex-wrap: nowrap; overflow-x: auto; width: 100%; order: 3; }
  /* the theme button beside the name (it wrapped onto a line of its own), library and export on the next line */
  .bar-top .spacer { display: none; }
  #theme { order: 1; margin-left: auto; }
  #loaded, #libwrap, #export { order: 2; }
  nav a { padding: 6px 10px; white-space: nowrap; }
  #lib { max-width: calc(100vw - 190px); }
  .libnote { padding: 6px 16px; }
  .drawer { padding: 16px; }
  .drawer-head { top: -16px; margin: -16px -16px 0; padding: 12px 16px 10px; }
  .drawer-head .wide-btn { display: none; }
  main { padding: 16px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .grid.two { grid-template-columns: minmax(0, 1fr); }
  .bars .lab { max-width: 130px; }
}
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <div class="brand">Puppi3's Track Analyzer <span id="mode"></span></div>
    <nav id="nav">
      <a href="#overview">Overview</a><a href="#tracks">Tracks</a><a href="#hype">Hype</a><a href="#colours">Colours</a>
      <a href="#tempo">Tempo view</a><a href="#mixes">Mixes</a><a href="#files">Files</a><a href="#setup">Setup</a>
    </nav>
    <div class="spacer"></div>
    <a id="loaded" href="#tempo" hidden></a>
    <label class="inline small muted" id="libwrap" data-tip="What the tabs here show: each track as heard at its own BPM, or every track stretched to one tempo (a tempo view you scanned). Only this page changes; Traktor and Lexicon stay as the tempo view labels beside this say.">This page shows <select id="lib"></select></label>
    <a id="export" class="btn" href="/export" download data-tip="Save every tab as one HTML file you can keep or send. It can't change anything.">Export snapshot</a>
    <button id="theme">◐</button>
  </div>
  <div class="libnote" id="libnote" hidden></div>
  <div class="jobbar" id="jobbar" hidden></div>
  <div class="banner" id="setupnote" hidden></div>
</header>
<main id="main"><div class="loading">Loading…</div></main>
<aside class="drawer" id="drawer" aria-hidden="true"><div id="drawer-body"></div></aside>
<div id="tip"></div>

<script>
"use strict";
const COLOURS = ["Red", "Orange", "Yellow", "Green", "Blue", "Violet", "Magenta"];
const S = { lib: "native", libs: null, tracks: {}, trackSort: { key: "track", dir: 1 }, page: "overview" };
try { S.lib = localStorage.getItem("ta-lib") || "native"; } catch (e) {}
try { const t = localStorage.getItem("ta-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 2) => v == null || v === "" ? "–" : typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(d)) : esc(v);
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const mmss = s => s == null ? "–" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const sw = (c, predicted) => c ? `<span class="sw sw-${esc(c)}${predicted ? " pred" : ""}"></span>` : "";
const colour = (c, predicted) => c ? `<span class="colour" data-tip="${predicted ? "Predicted by the colour model (not set by you)" : "Your colour in Traktor"}">${sw(c, predicted)}${esc(c)}${predicted ? "?" : ""}</span>` : `<span class="dim">–</span>`;
const trackName = t => `<div class="trk"><div class="t">${esc(t.title || t.filename || t.file || "")}</div>${t.artist ? `<div class="a">${esc(t.artist)}</div>` : ""}</div>`;
function hypeBadge(h) {
  if (h == null) return `<span class="dim">–</span>`;
  const a = 0.12 + (h - 1) / 9 * 0.7;
  return `<span class="hype" style="background:color-mix(in srgb, var(--bar) ${Math.round(a * 100)}%, transparent);color:var(--text)">${h}</span>`;
}
const parseScores = s => (s || "").split(";").map(x => x.trim()).filter(Boolean).map(x => {
  const m = x.match(/^(.*)\s+(-?[\d.]+)$/); return m ? { label: m[1], value: +m[2] } : { label: x, value: null };
});

const SNAP = window.SNAPSHOT || null;
const LOCK = `<svg width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><rect x="1" y="5" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M3 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`;
const lock = what => `<span class="lock" data-tip="${what} held: kept as it is when writing to files, Traktor or Lexicon">${LOCK}</span>`;
if (SNAP) {
  $("#mode").textContent = `· snapshot of ${SNAP.made}`;
  $("#export").remove();
  document.querySelector('#nav a[href="#files"]').remove();
  document.querySelector('#nav a[href="#setup"]').remove();
} else $("#mode").textContent = "· local";
function snapHype(h, p) {
  const src = p.gems == 1 ? h.gems : p.least == 1 ? h.least : h.most;
  if (src.error) return src;
  const keys = p.key ? camelotNeighbours(p.key) : null, bpm = p.bpm ? +p.bpm : null, tol = +(p.tolerance || 4);
  const tracks = src.tracks.filter(t => (!p.colour || (t.colour || "").toLowerCase() === p.colour.toLowerCase())
    && (!bpm || (t.bpm && Math.abs(t.bpm - bpm) <= bpm * tol / 100)) && (!keys || keys.includes(t.camelot)));
  const filters = [p.colour && `colour ${p.colour}`, bpm && `BPM ${bpm} ±${tol}%`, keys && `Camelot ${keys.join(", ")}`,
    p.gems == 1 && "gems: hype 8+ but 4 stars or fewer, or played at most once"].filter(Boolean);
  return { scored: src.scored, matches: tracks.length, showing: Math.min(+p.limit || 100, tracks.length), order: p.least == 1 ? "least hype first" : "most hype first",
    filters: filters.length ? filters : ["none"], tracks: tracks.slice(0, +p.limit || 100) };
}
function snapApi(path, p) {
  const D = SNAP, lib = p.lib || "native";
  const res = (() => { switch (path) {
    case "libraries": return D.libraries;
    case "stats": return D.stats[lib];
    case "tracks": return D.tracks[lib];
    case "suggest": {
      const sg = D.suggest[lib]?.[p.path];
      if (!sg || sg.error) return sg;
      const by = new Map(D.tracks[lib].tracks.map(t => [t.path, t]));
      return { rule: sg.rule, matches: sg.matches, tracks: sg.paths.map(x => by.get(x)).filter(Boolean).map(t => ({ ...t, bpm: t.mix_bpm, camelot: t.mix_camelot })) };
    }
    case "hype": return D.hype[lib] && snapHype(D.hype[lib], p);
    case "colours/review": return D.review;
    case "colours/explain": return D.explain;
    case "colours/kept": return D.kept;
    case "tempo/report": return D.tempo[String(+p.bpm)];
    case "cues": return D.cues?.[p.path] || { error: "No cue suggestions for this track in this snapshot." };
    case "saved": return { files: D.saved, folders: ["this snapshot"] };
    case "saved-file": return D.files[p.id];
  } })();
  if (!res) throw new Error("Not in this snapshot.");
  if (res.error) throw new Error(res.error);
  return res;
}
// an answer's JSON; one that isn't JSON (a crash, a page from something else on the port) becomes its status
const readJSON = async r => { try { return await r.json(); } catch (e) { return { error: `The server answered ${r.status} ${r.statusText}` }; } };
async function hold(paths, kind, on) {
  const d = await postJSON("/api/hold", { paths, kind, on });
  const set = new Set(paths);
  for (const list of Object.values(S.tracks)) for (const t of list) if (set.has(t.path)) { if (on) t["held_" + kind] = true; else delete t["held_" + kind]; }
  return d;
}
async function api(path, params = {}, { signal } = {}) {
  if (SNAP) return snapApi(path, params);
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== ""));
  let r;
  for (let attempt = 0; ; attempt++) {
    try { r = await fetch(`/api/${path}${q.toString() ? "?" + q : ""}`, { signal }); break; }
    catch (e) { // no answer at all: the server is restarting, or was stopped
      if (e.name === "AbortError") throw e;  // given up on by the page (another track opened)
      if (attempt >= 2) throw new Error("Can't reach the Puppi3's Track Analyzer server. Start it again: double-click Start Puppi3's Track Analyzer.command (on a Mac), or run `uv run dj-track-analyzer web` in a terminal.");
      await new Promise(ok => setTimeout(ok, 600 * (attempt + 1)));
    }
  }
  const d = await readJSON(r);
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
const errBox = e => `<div class="err">${esc(e.message || e)}${SNAP ? "" : ` <button style="margin-left:8px" onclick="route()">Retry</button>`}</div>`;
// a friendly "nothing here yet": what it is, what to do, and (live only) a link to do it
const empty = (title, body, action = "", card = true) => `<div class="${card ? "card " : ""}empty"><div class="et">${title}</div><div class="eb small">${body}</div>${action ? `<div class="ea">${action}</div>` : ""}</div>`;
const toSetup = text => SNAP ? "" : `<a class="btn" href="#setup">${text} →</a>`;  // a snapshot has no Setup

function bars(items, { max, fmtVal = v => fmt(v), colourLabels = false } = {}) {
  if (!items.length) return `<div class="dim">Nothing yet.</div>`;
  const m = max ?? Math.max(...items.map(i => i.value || 0), 1e-9);
  // an item with `go` (a Tracks filter) opens the Tracks tab filtered that way when clicked
  const go = i => i.go ? ` go" data-go="${esc(JSON.stringify(i.go))}` : "";
  const tipOf = i => esc((i.tip || `${i.label}: ${fmtVal(i.value)}`) + (i.go ? "\nClick to show these tracks" : ""));
  return `<div class="bars">${items.map(i => `
    <div class="lab${go(i)}" title="${esc(i.label)}">${colourLabels ? sw(i.label) : ""}${esc(i.label)}</div>
    <div class="track row-h${go(i)}" data-tip="${tipOf(i)}"><div class="fill" style="width:${Math.max(0, (i.value || 0) / m * 100)}%"></div></div>
    <div class="val">${i.valText ?? fmtVal(i.value)}</div>`).join("")}</div>`;
}
function columns(items) {
  const m = Math.max(...items.map(i => i.value), 1);
  const every = Math.ceil(items.length / 12);
  return `<div class="cols">${items.map(i => `<div class="c${i.go ? ` go" data-go="${esc(JSON.stringify(i.go))}` : ""}" style="height:${i.value / m * 100}%" data-tip="${esc(i.label)}: ${i.value}${i.go ? "\nClick to show these tracks" : ""}"></div>`).join("")}</div>
    <div class="cols-x">${items.map((i, k) => `<span>${k % every ? "" : esc(i.short ?? i.label)}</span>`).join("")}</div>`;
}
function table(cols, rows, { onRow, rowAttr } = {}) {
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${c.r ? "r" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr ${rowAttr ? rowAttr(r, i) : ""}>${cols.map(c => `<td class="${c.r ? "r num" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// tooltip
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
});
document.addEventListener("mousemove", e => {
  if (tip.style.display !== "block") return;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// theme: follow the system → light → dark → system
const THEMES = { "": ["◐", "Theme: follows your system (click for light)"], light: ["☀", "Theme: light (click for dark)"], dark: ["☾", "Theme: dark (click to follow your system)"] };
function themeButton() { const [icon, tipText] = THEMES[document.documentElement.dataset.theme] || THEMES[""]; $("#theme").textContent = icon; $("#theme").dataset.tip = tipText; $("#theme").setAttribute("aria-label", tipText); }
$("#theme").onclick = () => {
  const root = document.documentElement, next = { light: "dark", dark: "" }[root.dataset.theme] ?? "light";
  if (next) root.dataset.theme = next; else delete root.dataset.theme;
  try { if (next) localStorage.setItem("ta-theme", next); else localStorage.removeItem("ta-theme"); } catch (e) {}
  themeButton(); tip.textContent = $("#theme").dataset.tip;
};
themeButton();

// ---------- library ----------
async function loadLibs() {
  S.libs = await api("libraries");
  const sel = $("#lib");
  const inTraktor = l => (l.bpm || null) === (S.libs.loaded_view || null);  // the one Traktor has loaded
  sel.innerHTML = S.libs.libraries.map(l => `<option value="${esc(l.id)}" title="${esc(l.label)}">${l.bpm ? `all tracks at ${esc(l.bpm)} BPM` : "tracks at own BPM"}${!SNAP && inTraktor(l) ? " (as Traktor)" : ""}</option>`).join("");
  if (!S.libs.libraries.some(l => l.id === S.lib)) S.lib = "native";
  sel.value = S.lib;
  sel.onchange = () => { S.lib = sel.value; try { localStorage.setItem("ta-lib", S.lib); } catch (e) {} route(); };
  libNote();
}
function libNote() {
  const n = $("#libnote"), v = S.libs.loaded_view, usesLib = ["overview", "tracks", "hype"].includes(S.page);
  $("#libwrap").style.visibility = usesLib ? "visible" : "hidden";
  loadedChips();
  const parts = [], shown = S.lib !== "native" ? +S.lib.replace("at-", "") : null;
  if (v) parts.push(`Traktor has the <b>${v} BPM view</b> loaded, so its Genre/Colour/Comment 2 show ${v} BPM values.`);
  if (usesLib && shown) parts.push(`This page shows <b>every track at ${esc(shown)} BPM</b>: as heard stretched to that tempo with key lock.`);
  if (!SNAP && usesLib && shown && shown !== v) parts.push(`Traktor itself has ${v ? `the ${v} BPM tempo view` : "<b>no tempo view</b> loaded (each track's own values)"}.`);
  n.innerHTML = parts.join(" "); n.hidden = !parts.length;
}
function loadedChips() {  // what Traktor (and Lexicon, if you use it) has loaded right now, on every tab
  const el = $("#loaded"), L = S.libs;
  el.hidden = !!SNAP;  // a snapshot can't know what's loaded now
  if (SNAP) return;
  const chip = (app, bpm) => `<span class="chip${bpm ? " warn" : ""}">${app} tempo view: ${bpm ? `${esc(bpm)} BPM` : "off"}</span>`;
  el.innerHTML = chip("Traktor", L.loaded_view) + (L.lexicon ? chip("Lexicon", L.lexicon_view) : "");
  el.dataset.tip = `Traktor: ${L.loaded_view ? `the ${L.loaded_view} BPM tempo view is loaded (genres, colours and Comment 2 as heard with every track at ${L.loaded_view} BPM)` : "no tempo view loaded, so genres, colours and Comment 2 are each track's own, at its own BPM"}`
    + (L.lexicon ? `. Lexicon: ${L.lexicon_view ? `the ${L.lexicon_view} BPM tempo view is loaded` : "no tempo view loaded"}` : "")
    + ". The Library picker only changes what this page shows. Switch on the Tempo view tab.";
}
document.addEventListener("visibilitychange", () => {  // `tempo load` / `native` may have run in a terminal meanwhile
  if (!document.hidden && S.libs && !SNAP) loadLibs().catch(() => {});
});
async function getTracks(lib = S.lib) {
  if (!S.tracks[lib]) {
    const d = await api("tracks", { lib });
    S.tracks[lib] = d.tracks;
    S.fixesPending = !!d.corrections_pending;
    navCounts();
    if (d.corrections_pending) setTimeout(async () => {  // corrections are still being counted: fetch again
      delete S.tracks[lib];
      try { await getTracks(lib); } catch (e) { return; }
      if (S.page === "tracks" && S.lib === lib) S.refreshTracks?.();  // the new counts into the list as it is now
    }, 4000);
  }
  return S.tracks[lib];
}

// the Tracks tab's count, and a dot when the model proposes corrections to your cues
function navCounts() {
  const list = S.tracks[S.lib], a = document.querySelector('#nav a[href="#tracks"]');
  if (!list || !a) return;
  const n = list.filter(t => t.type === "track").length, fixes = list.filter(t => t.corrections > 0).length;
  a.innerHTML = `Tracks<span class="count">${n}</span>${fixes ? `<span class="dot" data-tip="${plural(fixes, "track")} with proposed corrections to your cues (Tracks: Cued or not → Has proposed corrections)"></span>` : ""}`;
}

// ---------- router ----------
const PAGES = { overview: pageOverview, tracks: pageTracks, hype: pageHype, colours: pageColours, tempo: pageTempo, mixes: pageMixes, files: pageFiles, setup: pageSetup };
async function route() {
  const [page, ...rest] = (location.hash.slice(1) || "overview").split("/");
  S.page = PAGES[page] ? page : "overview";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + S.page));
  if (S.libs) libNote();
  if (!SNAP) { jobBar(); refreshSetupNote(); }
  if (S.page !== "tracks") getTracks().then(navCounts, () => {});  // in the background (cached): the tab's count
  const main = $("#main"), me = S.routeId = (S.routeId || 0) + 1;
  main.innerHTML = `<div class="loading">Loading…</div>`;
  try { await PAGES[S.page](main, decodeURIComponent(rest.join("/"))); }
  catch (e) { if (me === S.routeId) main.innerHTML = errBox(e); }
}
addEventListener("hashchange", route);

// ---------- overview ----------
async function pageOverview(main) {
  const d = await api("stats", { lib: S.lib });
  if (!d.tracks) {
    main.innerHTML = `<div class="page-head"><div><h2>Overview</h2></div></div>` + empty("Nothing scanned yet",
      "Once your music is scanned, this shows your genres, tempos, keys and colours at a glance.", toSetup("Scan your music"));
    return;
  }
  const genres = Object.entries(d.genres).map(([g, v]) => ({ label: g, value: v.tracks, valText: `${v.tracks} · ${v.avg_bpm ?? "–"} BPM`, go: { genre: g, genreTop: true },
    tip: `${g}: ${v.tracks} tracks with it as their top genre, average ${v.avg_bpm ?? "–"} BPM` }));
  const hist = Object.entries(d.bpm_histogram).map(([b, n]) => { const [lo, hi] = b.split("-"); return { label: `${b} BPM`, short: lo, value: n, go: { bpmMin: lo, bpmMax: hi } }; });
  const keys = Object.entries(d.top_camelot_keys).map(([k, n]) => ({ label: k, value: n, go: { key: k } }));
  const cols = COLOURS.filter(c => d.colours[c]).map(c => ({ label: c, value: d.colours[c], go: { colour: c } }));
  const st = S.libs.status;
  main.innerHTML = `
    <div class="page-head"><div><h2>Overview</h2><div class="muted">${esc(S.libs.libraries.find(l => l.id === S.lib)?.label || "")}</div></div></div>
    <div class="tiles">
      <div class="tile go" data-go="{}" data-tip="Click to show every file"><div class="v">${d.tracks}</div><div class="l">scanned files</div></div>
      <div class="tile"><div class="v">${Object.keys(d.genres).length}</div><div class="l">genres in use</div></div>
      <div class="tile ${d.errors ? "bad go" : "good"}" ${d.errors ? `data-go='{"errors":true}' data-tip="Click to show the files that couldn't be analysed"` : ""}><div class="v">${d.errors}</div><div class="l">analysis errors</div></div>
      <div class="tile"><div class="v" style="font-size:16px;padding-top:6px">${esc(d.last_scan || "–")}</div><div class="l">last scan</div></div>
    </div>

const GRIDPLAY = { src: null, btn: null };
function gridStop() {

// A few bars where the kick plays, looped, with a click on each grid line: as Traktor has it (shift 0) or moved
async function gridClick(path, g, shift, btn) {
  if (GRIDPLAY.btn === btn) return gridStop();
  gridStop(); deckStopLoop(); DECK.audio.pause();
  const t0 = g.preview_ms ?? g.grid_ms, beats = 16, beat = g.beat_ms;  // a stretch whose kick agreed with the reading
  btn.dataset.label ??= btn.textContent; btn.textContent = "Loading…"; GRIDPLAY.btn = btn;
  try {
    if (!DECK.ctx) { DECK.ctx = new AudioContext(); DECK.gain = DECK.ctx.createGain(); DECK.gain.gain.value = deckVolume(); DECK.gain.connect(DECK.ctx.destination); }
    if (DECK.ctx.state === "suspended") await DECK.ctx.resume();
    const r = await fetch(`/api/loop?path=${encodeURIComponent(path)}&start=${t0 / 1000}&len=${beats * beat / 1000}`);
    if (!r.ok) throw new Error((await readJSON(r)).error);
    const src0 = await DECK.ctx.decodeAudioData(await r.arrayBuffer());
    if (GRIDPLAY.btn !== btn) return;  // stopped or another one meanwhile
    const sr = src0.sampleRate, n = src0.length, buf = DECK.ctx.createBuffer(src0.numberOfChannels, n, sr);
    const clickLen = Math.round(0.03 * sr), MUSIC = 0.45;  // the music turned down so the click stands out (mastered tracks sit near full scale)

}

    const OX = t => t / dur * W;  // every cue on the overview too: yours white + number, suggested blue, loop orange, corrections yellow
    for (const l of c.loop_ideas || []) { g.fillStyle = "#f08a24"; g.fillRect(OX(l.ms / 1000), OV0, Math.max(3, OX(l.len_ms / 1000)), 4); }
    for (const q of c.cues.filter(q => !sugHidden(c, q))) { g.fillStyle = "rgba(111,180,255,.95)"; g.fillRect(Math.round(OX(q.ms / 1000)), OV0 + (OV1 - OV0) / 2, 2, (OV1 - OV0) / 2); }
    for (const f of (c.corrections || []).filter(f => !fixSettled(c, f) && !pickedMove(box, f))) { g.fillStyle = "#ffd23f"; g.fillRect(Math.round(OX(f.to_ms / 1000)), OV0, 2, OV1 - OV0); }
    g.font = "bold 9px system-ui, sans-serif"; g.textAlign = "left";
    for (const y of shownCues(c, box)) {
      if (y.del) { const x = Math.round(OX(y.ms / 1000)) + 0.5; g.setLineDash([2, 2]); g.strokeStyle = "#ff786e"; g.beginPath(); g.moveTo(x, OV0); g.lineTo(x, OV1); g.stroke(); g.setLineDash([]); continue; }
      if (y.status === "moved") { g.fillStyle = "rgba(160,160,160,.7)"; g.fillRect(Math.round(OX(y.from_ms / 1000)), OV0, 1, OV1 - OV0); }
      const x = Math.round(OX(y.ms / 1000)), col = y.status === "new" ? "#4cd17a" : y.status === "moved" ? "#ffd23f" : "#fff";
      g.fillStyle = col; g.fillRect(x, OV0, 1, OV1 - OV0);
      if (y.type === "loop" && y.bars) g.fillRect(x, OV1 - 3, Math.max(3, OX(y.bars * c.bar_seconds)), 3);
      const label = y.hotcue >= 0 ? String(y.hotcue + 1) : y.type === "loop" ? "L" : "";
      if (label) { g.fillStyle = col; g.fillRect(x + 1, OV0, 9, 10); g.fillStyle = "#0c0c0e"; g.fillText(label, x + 3, OV0 + 8); }
    }
    for (const y of pend?.adds || []) {  // pending new cues on the overview: dashed, outlined number
      const x = Math.round(OX(y.ms / 1000)) + 0.5, col = y.nofit ? "rgba(255,120,110,.95)" : "#4cd17a";
      g.setLineDash([2, 2]); g.strokeStyle = col; g.beginPath(); g.moveTo(x, OV0); g.lineTo(x, OV1); g.stroke(); g.setLineDash([]);
      if (y.hotcue != null && y.hotcue >= 0) { g.strokeRect(x + 1, OV0 + 0.5, 9, 10); g.fillStyle = col; g.fillText(String(y.hotcue + 1), x + 3, OV0 + 8); }
    }
    if (zoomed()) {
      const a = st.v0 / dur * W, z = st.v1 / dur * W;
      g.fillStyle = "rgba(12,12,14,.6)"; g.fillRect(0, OV0, a, OV1 - OV0); g.fillRect(z, OV0, W - z, OV1 - OV0);
      g.strokeStyle = "#fff"; g.strokeRect(a + 0.5, OV0 + 0.5, Math.max(2, z - a - 1), OV1 - OV0 - 1);
    }
    if (zl) {  // close in: times to the hundredth, the length in beats, and how fine the waveform is
      const tm = t => span < 10 ? `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}` : mmss(t);
      const len = span < 2 * c.bar_seconds ? `${(span / beat).toFixed(1)} beats` : `${Math.round(span / c.bar_seconds)} bars`;
      const res = data === over ? "" : ` · ${span * 1000 / W < 10 ? (span * 1000 / W).toFixed(2) + " ms" : (span / W).toFixed(2) + " s"} a pixel${rate() <= 100 || fineOk() ? "" : " · sharpening…"}`;
      zl.textContent = zoomed() ? `${tm(st.v0)}–${tm(st.v1)} · ${len}${st.loading ? " · loading detail…" : res}` : "whole track";
    }
  }

  const zoomAt = (t, f) => setView(t - (t - st.v0) * f, t + (st.v1 - t) * f);
  const timeAt = x => st.v0 + x / W * (st.v1 - st.v0);
  cv.addEventListener("wheel", e => {
    const x = e.offsetX;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(timeAt(x), Math.exp(e.deltaY * 0.01)); }  // pinch / ctrl+scroll
    else if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && zoomed()) { e.preventDefault(); const d = e.deltaX / W * (st.v1 - st.v0); setView(st.v0 + d, st.v1 + d); }
  }, { passive: false });
  cv.ondblclick = e => zoomAt(timeAt(e.offsetX), e.shiftKey ? 2 : 0.5);
  let drag = null;
  cv.onmousedown = e => {
    if (e.offsetY >= OV0) { const t = e.offsetX / W * dur, h = (st.v1 - st.v0) / 2; setView(t - h, t + h); drag = { ov: true }; return; }
    drag = { x: e.clientX, v0: st.v0, v1: st.v1, moved: false };
  };
  cv.onmouseup = e => {  // a click (not a drag) on the waveform jumps there, like Traktor
    if (drag && !drag.ov && !drag.moved && !SNAP) deckSeek(timeAt(e.offsetX), deckPlaying() || !!DECK.waiting || !DECK.loaded, null);
  };
  WAVE_UP?.abort(); WAVE_UP = new AbortController();  // drawWave runs on every redraw: drop the last one's listener
  window.addEventListener("mouseup", () => { drag = null; cv.style.cursor = ""; }, { signal: WAVE_UP.signal });
  const marks = [...myCues(c).map(y => ({ t: y.ms / 1000, s: `${y.status === "new" ? "approved (not written yet): " : y.status === "moved" ? "your cue, approved to move here: " : ""}your ${cueKind(y).toLowerCase()}${y.hotcue >= 0 ? ` (slot ${y.hotcue + 1})` : ""}` })),
    ...c.cues.map(q => ({ t: q.ms / 1000, s: `suggested: ${q.name}` })), ...(c.loop_ideas || []).map((l, k) => ({ t: l.ms / 1000, s: `loop idea L${k + 1}: ${l.kind} (${l.bars} bars, ${l.why})` })),
    ...(c.corrections || []).filter(f => !fixSettled(c, f)).map(f => ({ t: f.to_ms / 1000, s: `proposed: move your cue ${f.hotcue + 1} here` }))];
  cv.onmousemove = e => {
    const x = e.offsetX;
    if (drag && drag.ov) { const t = x / W * dur, h = (st.v1 - st.v0) / 2; setView(t - h, t + h); return; }
    if (drag && Math.abs(drag.x - e.clientX) > 3) drag.moved = true;
    if (drag && drag.moved) { const d = (drag.x - e.clientX) / W * (drag.v1 - drag.v0); cv.style.cursor = "grabbing"; setView(drag.v0 + d, drag.v1 + d); }
    if (e.offsetY >= OV0) { hl.style.display = "none"; tip.textContent = "Click or drag to move the view"; tip.style.display = "block"; return; }
    const near = marks.map(m => ({ ...m, d: Math.abs(X(m.t) - x) })).filter(m => m.d < 7).sort((a, b) => a.d - b.d);
    let lines, bi;
    if (near.length) {  // snap to the marker: its exact bar and time
      const t0 = near[0].t, same = near.filter(m => Math.abs(m.t - t0) < c.bar_seconds / 2), bl = barLabel(c, barAt(t0));
      const off = (t0 - barT(barAt(t0))) / beat;
      lines = [...same.map(m => m.s), `${bl.text} · ${mmss(t0)}${Math.abs(off) > 0.1 ? ` · ${off > 0 ? "+" : ""}${off.toFixed(1)} beats off the bar line` : ""}`, bl.phrase];
      bi = barAt(t0);
    } else {
      const t = timeAt(x); bi = Math.floor((t - c.first_bar_s) / c.bar_seconds); const bl = barLabel(c, bi);
      const bt = Math.floor((t - barT(bi)) / beat) + 1;
      lines = [`${bl.text}${zoomed() ? `, beat ${bt}` : ""} · ${mmss(t)}`, bl.phrase];
    }
    hl.style.left = X(barT(bi)) + "px"; hl.style.width = Math.max(2, X(barT(bi) + c.bar_seconds) - X(barT(bi))) + "px"; hl.style.display = "block";
    tip.textContent = lines.join("\n"); tip.style.display = "block";
  };
  cv.onmouseleave = () => { tip.style.display = "none"; hl.style.display = "none"; };
  box.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => {
    const z = b.dataset.zoom, mid = (st.v0 + st.v1) / 2;
    if (z === "fit") setView(0, dur); else zoomAt(mid, z === "in" ? 0.5 : 2);
  });
  box._wave = { X: t => X(t), W: () => W, st, setView: (a, b) => setView(a, b), zoomed, dur, redraw: () => render() };
  const r0 = render;
  render = () => { r0(); deckUi(); };  // keep the playhead in place when the view changes
  setView(st.v0, st.v1);
}
function cueTable(c, sugg) {
  const yours = myCues(c).map(y => ({ when: y.ms / 1000, what: (y.status === "new" ? "✓ approved: " : y.status === "moved" ? "✓ moved: " : "") + `${cueKind(y)}${y.hotcue >= 0 ? ` · slot ${y.hotcue + 1}` : ""}`, who: "yours" }));
  const ours = sugg.map(q => ({ when: q.ms / 1000, what: q.name, who: "suggested" }));
  (c.loop_ideas || []).forEach((l, k) => ours.push({ when: l.ms / 1000, what: `Loop idea L${k + 1}: ${l.bars} bars · ${l.kind}`, who: "suggested" }));
  const rows = [...yours, ...ours].sort((a, b) => a.when - b.when);
  return `<details style="margin-top:8px"><summary class="small muted">As a list</summary>${table([{ h: "Time", f: r => mmss(r.when) },
    { h: "", f: r => r.who === "yours" ? `<span class="chip">yours</span>` : `<span class="chip good">suggested</span>` }, { h: "What", f: r => esc(r.what) }], rows)}</details>`;
}

// ---------- jobs: the CLI's own commands, run by the server one at a time (jobs.py) ----------
const JOB = { job: null, lines: [], since: 0, timer: 0, listeners: new Set(), waiters: [], seenEnd: undefined, flash: null, hidden: null };
async function jobPoll() {
  clearTimeout(JOB.timer);
  let d;
  try { d = await api("jobs", { since: JOB.since }); } catch (e) { JOB.timer = setTimeout(jobPoll, 3000); return; }
  const j = d.job;
  if (j && JOB.job && JOB.job.id !== j.id && JOB.since) { JOB.since = 0; JOB.job = null; return jobPoll(); }  // a newer job: its log from the start
  if (j) {
    if (!JOB.job || JOB.job.id !== j.id) JOB.lines = [];
    JOB.lines.push(...j.lines);
    if (JOB.lines.length > 3000) JOB.lines.splice(0, JOB.lines.length - 3000);
    JOB.since = j.line_to; JOB.job = j;
    if (!j.running) {
      if (JOB.seenEnd !== j.id) { if (JOB.seenEnd !== undefined) jobEnded(j); JOB.seenEnd = j.id; }
      JOB.waiters = JOB.waiters.filter(w => w.id !== j.id || (w.ok(j), false));
    }
  }
  JOB.listeners.forEach(f => f());
  jobBar();
  if (j && j.running) JOB.timer = setTimeout(jobPoll, 1000);
}
// Start a job; resolves with the finished job (its result, or its error message).
async function startJob(action, options = {}, dry_run = false) {
  const d = await postJSON("/api/jobs/start", { action, options, dry_run });
  if (JOB.seenEnd === undefined) JOB.seenEnd = null;
  JOB.flash = null;
  const done = new Promise(ok => { JOB.waiters.push({ id: d.job.id, ok }); });
  await jobPoll();
  rerenderSetup();  // its buttons wait while a job runs
  return done;
}
const jobRunning = () => !!JOB.job?.running;
async function jobEnded(j) {
  S.tracks = {}; SETUP = null; LOGS = null;
  if (!j.dry_run) JOB.flash = j;
  try { await loadLibs(); } catch (e) {}
  await refreshSetupNote();
  rerenderSetup();
}
// Draw the Setup page again in place (no "Loading…", so it doesn't jump).
function rerenderSetup() { if (S.page === "setup") pageSetup($("#main")).catch(e => { $("#main").innerHTML = errBox(e); }); }
function progressBar(j, width) {
  const p = j.progress;
  return p && p.total ? `<div class="progress" style="${width ? `width:${width}` : ""}"><div style="width:${Math.round(p.done / p.total * 100)}%"></div></div>`
    : `<div class="progress indet" style="${width ? `width:${width}` : ""}"><div></div></div>`;
}
const progressText = j => j.progress && j.progress.total ? `${j.progress.done} of ${j.progress.total} · about ${esc(j.progress.eta)} left` : `${mmss(j.elapsed)} so far`;
function jobBar() {
  const bar = $("#jobbar"), j = JOB.job;
  if (SNAP || !j) { bar.hidden = true; return; }
  if (j.running) {
    bar.className = "jobbar"; bar.hidden = false;
    bar.innerHTML = `<b>${esc(j.label)}${j.dry_run ? " (preview)" : ""}</b>${progressBar(j)}<span class="muted">${progressText(j)}</span>
      ${S.page !== "setup" ? `<a href="#setup">Show</a>` : ""}<button id="jb-stop" ${j.stopping ? "disabled" : ""}>${j.stopping ? "Stopping…" : "Stop"}</button>`;
    $("#jb-stop").onclick = () => postJSON("/api/jobs/stop", {}).then(jobPoll);
  } else if (JOB.flash && JOB.flash.id === j.id) {
    bar.className = `jobbar ${j.error ? "bad" : "good"}`; bar.hidden = false;
    bar.innerHTML = `<span>${j.error === "Stopped." ? `<b>${esc(j.label)}</b> stopped. It carries on where it stopped next time.` : j.error ? `<b>${esc(j.label)}</b> stopped: ${esc(j.error)}` : `<b>✓ ${esc(j.label)}</b> finished`}</span>
      ${S.page !== "setup" ? `<a href="#setup">Details</a>` : ""}<button id="jb-x">OK</button>`;
    $("#jb-x").onclick = () => { JOB.flash = null; jobBar(); };
  } else bar.hidden = true;
}

// What a writer reported, readably: the counts, notes, a few examples, and everything else folded away.
const HIDE = new Set(["dry_run", "changed", "collection", "examples", "changes", "smartlists", "backup", "undo", "fields", "note", "warning",
  "now_loaded", "clock", "smartlist_folder", "kept", "restored_from"]);
const LABELS = { would_write: "files that would get a new tag", written: "files tagged", would_restore: "files that would get their old tags back",
  restored: "files given their old tags back", skipped_changed_since_scan: "skipped: changed on disk since the scan (scan again first)",
  unchanged: "already right", missing: "files no longer there", traktor_tracks: "tracks in Traktor", matched_scanned_tracks: "of them scanned" };
const human = k => LABELS[k] || k.replace(/_/g, " ");
function exampleText(x) {
  return typeof x === "string" ? x : Object.entries(x).map(([k, v]) => k === "file" ? v : `${k}: ${v}`).join(" · ");
}
function resultSummary(r, depth = 0) {
  if (!r || typeof r !== "object") return r ? `<div>${esc(r)}</div>` : "";
  const nums = Object.entries(r).filter(([k, v]) => typeof v === "number" && v && !HIDE.has(k));
  const nested = Object.entries(r).filter(([k, v]) => v && typeof v === "object" && !Array.isArray(v) && !HIDE.has(k));
  const ex = r.examples || r.changes || [];
  return `${nums.length ? `<ul style="max-height:none">${nums.map(([k, v]) => `<li>${esc(human(k))}: <b>${v}</b></li>`).join("")}</ul>` : ""}
    ${r.warning ? `<div class="warnbox">${esc(r.warning)}</div>` : ""}
    ${[r.note, r.clock && `Clock: ${r.clock}`, r.now_loaded && `Now loaded: ${r.now_loaded}`, r.smartlist_folder && `Smartlist folder: ${r.smartlist_folder}`]
      .filter(Boolean).map(t => `<div class="small">${esc(t)}</div>`).join("")}
    ${Array.isArray(r.smartlists) && r.smartlists.length ? `<div class="small muted">${r.smartlists.length} Smartlists: ${esc(r.smartlists.join(", "))}</div>` : ""}
    ${ex.length ? `<div class="small" style="margin-top:6px"><b>For example</b></div><ul>${ex.slice(0, 15).map(x => `<li>${esc(exampleText(x))}</li>`).join("")}</ul>` : ""}
    ${depth ? "" : nested.map(([k, v]) => `<div class="small" style="margin-top:8px"><b>${esc(human(k))}</b></div>${resultSummary(v, 1)}`).join("")}
    ${depth ? "" : `<details style="margin-top:8px"><summary class="small muted" style="cursor:pointer">Everything it reported</summary><div class="tree">${tree(r)}</div></details>`}`;
}
function nothingToDo(r) {  // as the CLI's say_if_nothing
  if (!r) return false;
  const parts = "changed" in r ? [r] : Object.values(r).filter(v => v && typeof v === "object" && !Array.isArray(v));
  const flags = parts.filter(d => "changed" in d).map(d => d.changed);
  const counts = ["written", "would_write", "restored", "would_restore", "top_genre_changed"].filter(k => k in r).map(k => r[k]);
  return (flags.length && !flags.some(Boolean)) || (!flags.length && counts.length && !counts.some(Boolean));
}
const TOUCHES_TRAKTOR = new Set(["traktor", "traktor_undo", "hype_traktor", "hype_remove", "colors_apply", "colors_recolour", "tempo_load", "tempo_native"]);
const NO_PREVIEW = new Set(["traktor_undo"]);
const cmdNote = j => `<div class="note">Same as <span class="mono">${esc(j.command)}</span> in a terminal.</div>`;
const OPEN_WARN = `<div class="warnbox"><b>Traktor is open.</b> Quit it first: it saves its collection when it quits and would undo these changes. Then press Check again.</div>`;

// Preview → write → undo for one of the CLI's writers, in a dialog.
async function writeDialog(action, options = {}, onDone) {
  const st = await getSetup().catch(() => null), label = a => st?.actions?.[a] || a;
  const dlg = document.createElement("dialog"); dlg.className = "write"; document.body.appendChild(dlg);
  dlg.addEventListener("close", () => { dlg.remove(); JOB.listeners.delete(live); });
  let title = label(action);
  const show = (html, buttons = "") => {
    dlg.innerHTML = `<h3>${esc(title)}</h3>${html}<div class="filters" style="margin-top:12px">${buttons}<button data-close>Close</button><span class="small muted" id="wd-msg"></span></div>`;
    dlg.querySelector("[data-close]").onclick = () => dlg.close();
  };
  const live = () => { const el = dlg.querySelector("#wd-live"), j = JOB.job; if (el && j?.running) el.textContent = j.live || j.lines.at(-1) || ""; };
  JOB.listeners.add(live);
  const busy = text => show(`<div class="muted">${esc(text)}</div><div class="mono small dim" id="wd-live" style="margin-top:6px;white-space:pre-wrap"></div>`);
  async function run(act, opts, dry) {
    try { return await startJob(act, opts, dry); } catch (e) { return { error: e.message, command: "" }; }
  }
  async function preview(act, opts) {
    title = label(act);
    if (NO_PREVIEW.has(act)) {
      show(`<div>Puts collection.nml back to how it was before the analyzer's last change${st?.traktor_backup ? ` (backup <span class="mono">${esc(st.traktor_backup)}</span>)` : ""}.
        It refuses if Traktor saved the collection since then, so nothing of yours is lost. Traktor must be closed.</div>`,
        `<button class="primary" data-go>Undo it</button>`);
      dlg.querySelector("[data-go]").onclick = () => write(act, opts);
      return;
    }
    busy("Checking what would change…");
    const j = await run(act, opts, true);
    if (j.error) return show(`<div class="err">${esc(j.error)}</div>${j.command ? cmdNote(j) : ""}`, `<button data-again>Check again</button>`), again(act, opts);
    const open = j.traktor_running && TOUCHES_TRAKTOR.has(act), nothing = nothingToDo(j.result);
    show(`${nothing ? `<div><b>Nothing would change:</b> everything is already up to date.</div>` : `<div class="small muted">Preview, nothing written yet:</div>`}
      ${resultSummary(j.result)}${open && !nothing ? OPEN_WARN : ""}
      ${nothing ? "" : `<div class="note">${TOUCHES_TRAKTOR.has(act) ? "A backup of Traktor's collection is made first, and you can undo it here afterwards." : "The files' original tags are saved first, so you can put them back."}</div>`}${cmdNote(j)}`,
      nothing ? "" : open ? `<button class="primary" data-again>Check again</button>` : `<button class="primary" data-go>Write it</button>`);
    again(act, opts);
    dlg.querySelector("[data-go]")?.addEventListener("click", () => write(act, opts));
  }
  function again(act, opts) { dlg.querySelector("[data-again]")?.addEventListener("click", () => preview(act, opts)); }
  async function write(act, opts) {
    busy("Writing…");
    const j = await run(act, opts, false);
    if (j.error) return show(`<div class="err">${esc(j.error)}</div>${j.command ? cmdNote(j) : ""}`, `<button data-again>Try again</button>`), again(act, opts);
    const r = j.result || {}, undo = j.undo;
    show(`<div style="color:var(--good)"><b>✓ Done.</b></div>${resultSummary(r)}
      ${r.backup ? `<div class="note">Backup: <span class="mono">${esc(r.backup)}</span>${undo === "traktor_undo" ? "<br>Undo works until Traktor saves its collection again (it does when it quits)." : ""}</div>` : ""}
      ${r.restored_from ? `<div class="note">Restored from <span class="mono">${esc(r.restored_from)}</span>.</div>` : ""}${cmdNote(j)}`,
      undo ? `<button data-undo>${esc(label(undo))}…</button>` : "");
    dlg.querySelector("[data-undo]")?.addEventListener("click", () => preview(undo, opts));
    onDone?.(j);
  }
  dlg.showModal();
  preview(action, options);
}

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

    <div class="act">${extra}<button id="${id}" ${disabled || ""}>Preview…</button></div></div>`;

  main.innerHTML = `<div class="page-head"><div><h2>Setup</h2><div class="muted">From a fresh install to everything in Traktor. Each button runs the same command as in a terminal (shown as it runs), in the background: you can use the other tabs meanwhile.</div></div></div>

    <div class="card"><h3>Into your files and Traktor</h3>
      <div class="note" style="margin:0 0 6px">Every change shows a preview first and nothing is written until you press Write. Traktor's collection is backed up before each write, and you can undo it.</div>

        ${st.tags.tagged_files ? `${plural(st.tags.tagged_files, "file")} changed so far; their original tags are saved.` : ""}`,
        `<label class="inline small"><input type="checkbox" id="wr-multi" ${SF.multi ? "checked" : ""}> close runner-up genres too ("Acid Trance; Hard Trance")</label>

        `<label class="inline small"><input type="checkbox" id="wr-colours" ${SF.colours ? "checked" : ""}> colours too</label>`, (noScan || !tk.collection) && "disabled")}
      ${w("wr-hype", "Hype in Traktor's Comment 2", `Adds "Hype 07" after anything already in Comment 2 (never your own Comment), so you can sort and search by it in Traktor.`,

      ${cm.model || cm.starter ? w("wr-capply", "Colour new tracks", `Scans tracks that are new in Traktor and gives the uncoloured ones their predicted colour${cm.model ? "" : " (from the starter scale)"}. Colours you set are never changed.`, "", !tk.collection && "disabled") : ""}
      ${cm.model ? w("wr-recolour", "Recolour clear disagreements", "Recolours the few tracks whose colour clearly disagrees with how they sound (gap 2.5+ colours, confidence 75%+; the Colours tab lists them). Tracks you keep always are skipped.", "", !tk.collection && "disabled") : ""}
      ${st.traktor_backup ? `<div class="step"><div class="ic">↶</div><div><div class="st">Undo the last change to Traktor</div><div class="small muted">Last backup: <span class="mono">${esc(st.traktor_backup)}</span></div></div><div class="act"><button id="wr-undo">Undo…</button></div></div>` : ""}

  bindVal("wr-colours", "colours", "checked"); bindVal("su-lexicon", "lexicon", "checked");

// The running (or last) job on the Setup page: progress, live log, result.
function jobPanel() {
  const box = $("#jobpanel"), j = JOB.job;
  if (!box || S.page !== "setup") return;
  if (!j || (j.dry_run && !j.running) || JOB.hidden === j.id) { box.innerHTML = ""; return; }
  const pre = box.querySelector("pre.log"), atEnd = !pre || pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30, top = pre?.scrollTop;
  const status = j.running ? `${progressBar(j, "100%")}<div class="small muted" style="margin-top:6px">${progressText(j)}${j.live ? ` · <span class="mono">${esc(j.live)}</span>` : ""}</div>`
    : j.error === "Stopped." ? `<div class="muted"><b>Stopped</b> after ${mmss(j.elapsed)}. It carries on where it stopped next time.</div>`
    : j.error ? `<div class="err">${esc(j.error)}</div>`
    : `<div style="color:var(--good)"><b>✓ Finished</b> in ${mmss(j.elapsed)}.${j.result?.this_run ? ` Analysed ${plural(j.result.this_run.analyzed, "track")}${j.result.this_run.errors ? `, ${j.result.this_run.errors} errors` : ""}.` : ""}</div>
      ${j.result ? `<details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">Everything it reported</summary><div class="tree">${tree(j.result)}</div></details>` : ""}`;
  box.innerHTML = `<div class="card" style="margin-bottom:16px"><div class="filters" style="margin-bottom:8px"><h3 style="margin:0">${esc(j.label)}${j.dry_run ? " (preview)" : ""}</h3><div class="spacer"></div>
      ${j.running ? `<button id="jp-stop" ${j.stopping ? "disabled" : ""}>${j.stopping ? "Stopping…" : "Stop"}</button>` : `<button id="jp-x">Hide</button>`}</div>
    <div class="mono small dim" style="margin-bottom:8px">${esc(j.command)}</div>${status}
    ${j.running ? `<div class="note">Stopping is safe: it keeps what's done and carries on next time. Closing this page doesn't stop it; stopping the web server does.</div>` : ""}
    <pre class="log">${esc(JOB.lines.slice(-400).join("\n")) || "…"}</pre></div>`;
  const p2 = box.querySelector("pre.log");
  p2.scrollTop = atEnd ? p2.scrollHeight : top;
  $("#jp-stop")?.addEventListener("click", () => postJSON("/api/jobs/stop", {}).then(jobPoll));
  $("#jp-x")?.addEventListener("click", () => { JOB.hidden = j.id; JOB.flash = null; jobPanel(); jobBar(); });
}
JOB.listeners.add(jobPanel);

// ---------- mixes ----------
let LOGS = null;
async function getLogs(force) { if (!LOGS || force) LOGS = await api("saved"); return LOGS; }
const ago = t => new Date(t * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
async function pageMixes(main, id) {
  const me = S.routeId, L = await getLogs(true), mixes = L.files.filter(f => f.kind === "mix");
  if (me !== S.routeId) return;
  if (!id && mixes.length) id = mixes[0].id;
  main.innerHTML = `<div class="split">
    <div class="card list" style="padding:8px"><div class="small muted" style="padding:4px 10px 8px">Saved <span class="mono">analyze</span> results of mixes in ${L.folders.map(esc).join(", ")}</div>
      ${mixes.map(f => `<a href="#mixes/${encodeURIComponent(f.id)}" class="${f.id === id ? "on" : ""}"><div>${esc(f.name)}</div><div class="k">${esc(f.recording || "")} · ${esc(f.duration || "")} · ${ago(f.modified)}</div></a>`).join("") || `<div class="dim small" style="padding:10px">No mixes yet.</div>`}
      <div style="padding:10px"><div class="drop" id="drop">Drop a JSON file here or <a href="#" id="pick">open one</a><input type="file" id="file" accept=".json,.txt" hidden></div></div>
    </div><div id="mix">${id ? `<div class="loading">Loading…</div>` : empty("No mix analysed yet",
      `Analyse a recorded DJ mix to see its genre, mood, a loudness timeline, a tracklist check against Traktor's history and clip ideas. Save the result in <span class="mono">logs/</span>:<br>
      <span class="mono">uv run dj-track-analyzer analyze &lt;mix.wav&gt; --tracklist --json-only &gt; logs/mix.json</span><br>or drop a saved JSON file on the left.`)}</div></div>`;
  dropZone($("#drop"), $("#file"), $("#pick"), data => { $("#mix").innerHTML = data.type === "dj_mix" ? renderMix(data) : `<div class="card tree">${tree(data)}</div>`; });
  if (id) {
    const me = S.routeId;  // a newer click wins over a slower earlier answer
    try { const d = await api("saved-file", { id }); if (me === S.routeId) $("#mix").innerHTML = renderMix(d); }
    catch (e) { if (me === S.routeId) $("#mix").innerHTML = errBox(e); }
  }
}
function dropZone(zone, input, pick, onData) {
  const read = file => { const fr = new FileReader(); fr.onload = () => { try { const txt = fr.result, i = txt.indexOf("{"); onData(JSON.parse(txt.slice(i, findEnd(txt, i)))); } catch (e) { alert("Not a JSON file: " + e.message); } }; fr.readAsText(file); };
  pick.onclick = e => { e.preventDefault(); input.click(); };
  input.onchange = () => input.files[0] && read(input.files[0]);
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("over"); };
  zone.ondragleave = () => zone.classList.remove("over");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); };
}
function findEnd(txt, i) { // end of the first JSON object (stderr may follow it in a teed file)
  let depth = 0, str = false;
  for (let k = i; k < txt.length; k++) {
    const c = txt[k];
    if (str) { if (c === "\\") k++; else if (c === '"') str = false; continue; }
    if (c === '"') str = true; else if (c === "{" || c === "[") depth++; else if ((c === "}" || c === "]") && --depth === 0) return k + 1;
  }
  return txt.length;
}
const toSec = s => { if (s == null) return null; const p = String(s).split(":").map(Number); return p.reduce((a, b) => a * 60 + b, 0); };
function keyChip(t) {
  const k = t.key_check; if (!k) return "";
  const cls = k === "match" ? "good" : /one step|neighbour|close/.test(k) ? "warn" : /short|unknown/.test(k) ? "" : "bad";
  return `<span class="chip ${cls}">${esc(k)}</span>`;
}
function renderMix(d) {
  const tl = d.timeline || [], tlist = d.tracklist, hl = d.highlights || [];
  const lufs = tl.map(s => s.lufs ?? -40), lo = Math.min(...lufs) - 2, hi = Math.max(...lufs);
  const hlSecs = hl.map(h => [toSec(h.start), toSec(h.end)]);
  const segHl = s => hlSecs.some(([a, b]) => toSec(s.start) < b && toSec(s.end) > a);
  const everyX = Math.ceil(tl.length / 10);
  const kl = tlist?.keylock;
  return `
    <div class="page-head"><div><h2>${esc((d.file || "").split("/").pop())}</h2><div class="muted">${esc(d.duration)} · ${fmt(d.loudness?.integrated_lufs, 1)} LUFS · range ${fmt(d.loudness?.loudness_range_lu, 1)} LU${d.analysis_seconds ? ` · analysed in ${Math.round(d.analysis_seconds)} s` : ""}</div></div></div>
    <div class="grid">
      <div class="card"><h3>Genre of the mix</h3>${bars((d.dj_genre || []).map(g => ({ label: g.genre, value: g.score })))}
        ${d.genre_basis?.dj_genre ? `<div class="note">${esc(d.genre_basis.dj_genre)}</div>` : ""}
        ${d.dj_genre_uncorrected ? `<div class="note">Without the psy gate: ${d.dj_genre_uncorrected.map(g => `${esc(g.genre)} ${g.score}`).join(", ")}</div>` : ""}</div>
      <div class="card"><h3>Mood</h3>${bars(Object.entries(d.mood || {}).map(([k, v]) => ({ label: k, value: v })), { max: 1, fmtVal: pct })}
        <div class="note">vocals ${pct(d.vocal_share)} of the mix · approachability ${fmt(d.approachability)}</div></div>
      <div class="card"><h3>Styles</h3>${bars((d.discogs_styles || []).map(s => ({ label: s.style, value: s.score })))}
        ${d.mixing ? `<div class="note">What the mixing (effects, stems, overlap) added: ${[...(d.mixing.up || []), ...(d.mixing.down || [])].map(esc).join(", ") || "nothing notable"}</div>` : ""}</div>
    </div>
    ${tl.length ? `<div class="card"><h3>Timeline <span class="dim small">(loudness per ${esc(tl[0].start)}–${esc(tl[0].end)} segment; hover for genre, key and tracks)</span></h3>
      <div class="timeline">${tl.map(s => `<div class="seg ${segHl(s) ? "hl" : ""}" style="height:${((s.lufs ?? lo) - lo) / (hi - lo || 1) * 100}%" data-tip="${esc(`${s.start}–${s.end}\n${s.dj_genre || "–"} · ${s.bpm ?? "–"} BPM · ${s.camelot || "–"} (${s.key || ""})\n${s.lufs} LUFS\n${(s.styles || []).join(", ")}${s.tracks?.length ? "\n♪ " + s.tracks.join("\n♪ ") : ""}`)}"></div>`).join("")}</div>
      <div class="tl-x">${tl.map((s, i) => `<span>${i % everyX ? "" : esc(s.start)}</span>`).join("")}</div>
      ${hl.length ? `<div class="legend"><span><i style="background:var(--bar)"></i>segment</span><span><i style="background:var(--c-orange)"></i>contains a highlight</span></div>` : ""}
      <details style="margin-top:10px"><summary class="small muted">Table</summary>${table([{ h: "Time", f: s => `${esc(s.start)}–${esc(s.end)}` }, { h: "BPM", r: 1, f: s => fmt(s.bpm) }, { h: "Key", f: s => esc(s.camelot || "–") },
        { h: "LUFS", r: 1, f: s => fmt(s.lufs, 1) }, { h: "Genre", f: s => esc(s.dj_genre || "–") }, { h: "Styles", f: s => `<span class="small">${esc((s.styles || []).join(", "))}</span>` }, { h: "Tracks", f: s => `<span class="small">${esc((s.tracks || []).join(" · "))}</span>` }], tl)}</details></div>` : ""}
    ${tlist ? `<div class="card"><h3>Tracklist check <span class="dim small">against Traktor's history</span></h3>
      <dl class="facts"><dt>History</dt><dd class="mono" style="word-break:break-all">${esc(tlist.history)}</dd><dt>Recording start</dt><dd>${esc(tlist.recording_start)}</dd>
      ${kl ? `<dt>Key lock</dt><dd><b>${esc(kl.verdict)}</b> · ${esc(kl.summary)} <span class="dim small">(${esc(kl.basis)}; blend lag ${kl.blend_lag_seconds} s)</span></dd>` : ""}
      ${tlist.overlap_share != null ? `<dt>Overlap</dt><dd>${pct(tlist.overlap_share)} of the mix has two decks playing</dd>` : ""}</dl>
      ${table([{ h: "#", r: 1, f: t => t.n }, { h: "Start", f: t => esc(t.start) }, { h: "Deck", f: t => esc(t.deck || "") }, { h: "Track", f: trackName },
        { h: "BPM", f: t => `${fmt(t.bpm)}${t.played_bpm ? ` → ${t.played_bpm} <span class="dim small">${esc(t.speed || "")}</span>` : ""}` },
        { h: "Key", f: t => `${esc(t.camelot || "–")}${t.heard_camelot && t.heard_camelot !== t.camelot ? ` <span class="dim small">heard ${esc(t.heard_camelot)}</span>` : ""} ${keyChip(t)}` },
        { h: "Genre", f: t => `${esc(t.library_genre || "–")}${t.genre && t.genre !== t.library_genre ? ` → <b>${esc(t.genre)}</b>` : ""}${t.genre_uncorrected && t.genre_uncorrected !== t.genre ? `<div class="dim small">ungated ${esc(t.genre_uncorrected)}</div>` : ""}` },
        { h: "Mixing", f: t => t.mixing ? `<span class="small">${[...(t.mixing.up || []), ...(t.mixing.down || [])].map(esc).join(", ")}</span>` : "" },
        { h: "Judged on", f: t => `<span class="small dim">${esc(t.judged_on || t.note || "")}</span>` }], tlist.tracks || [])}</div>` : ""}
    ${hl.length ? `<div class="card"><h3>Clip suggestions</h3>${table([{ h: "Rank", r: 1, f: h => h.rank }, { h: "Mix time", f: h => `${esc(h.start)}–${esc(h.end)}` },
        { h: "Video time", f: h => esc(h.video || "–") }, { h: "LUFS", r: 1, f: h => fmt(h.lufs, 1) }, { h: "Rise", r: 1, f: h => `${fmt(h.rise_lu, 1)} LU` }, { h: "Track", f: h => esc(h.track || "") }], hl)}
      <div class="note">Make previews: <span class="mono">clips &lt;this.json&gt; --video &lt;final.mp4&gt;</span></div></div>` : ""}
    ${d.chapters?.length ? `<div class="card"><h3>YouTube chapters <button style="float:right" onclick="navigator.clipboard.writeText(this.closest('.card').querySelector('textarea').value);this.textContent='Copied'">Copy</button></h3><textarea readonly>${esc(d.chapters.join("\n"))}</textarea></div>` : ""}
    <details class="card"><summary class="muted">Raw JSON</summary><div class="tree" style="margin-top:8px">${tree(d)}</div></details>`;
}

function tree(v, key, depth = 0) {
  const k = key != null ? `<span class="key">${esc(key)}</span>: ` : "";
  if (v === null) return `<div class="kv">${k}<span class="dim">null</span></div>`;
  if (Array.isArray(v) || typeof v === "object") {
    const entries = Array.isArray(v) ? v.map((x, i) => [i, x]) : Object.entries(v);
    const simple = entries.every(([, x]) => x === null || typeof x !== "object") && entries.length <= 8 && JSON.stringify(v).length < 110;
    if (simple) return `<div class="kv">${k}${esc(JSON.stringify(v))}</div>`;
    const label = Array.isArray(v) ? `[${v.length}]` : `{${entries.length}}`;
    return `<details ${depth < 1 ? "open" : ""}><summary>${k}<span class="dim">${label}</span></summary>${entries.map(([kk, x]) => tree(x, kk, depth + 1)).join("")}</details>`;
  }
  const cls = typeof v === "string" ? "s" : typeof v === "number" ? "n" : "b";
  return `<div class="kv">${k}<span class="${cls}">${esc(typeof v === "string" ? JSON.stringify(v) : v)}</span></div>`;
}

}
