[project]
name = "dj-track-analyzer"
version = "0.1.0"
description = "Local music analysis for DJs: BPM, key/Camelot, genre, mood and Traktor colour, Traktor/Lexicon sync and an MCP server"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Apple Silicon: this build runs on macOS 11+ (newer builds need macOS 15).
    "essentia-tensorflow==2.1b6.dev1177; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "essentia-tensorflow>2.1b6.dev1177; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "mcp>=2.3,<3",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "mutagen>=1.47",
    "numpy<2",
    # Rust copies of Essentia steps (dsp/), bit for bit, faster. Prebuilt by CI, so no Rust needed.
    "track-analyzer-dsp==0.2.0; (sys_platform == 'darwin') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.optional-dependencies]
# Vocals and synths in a loop (cues.loop_parts): Demucs separates the loop's audio into stems. PyTorch, about 600 MB.
# `uv sync --extra stems`
stems = ["demucs==4.0.1"]

[project.scripts]
dj-track-analyzer = "dj_track_analyzer.cli:main"

[tool.uv.sources]
track-analyzer-dsp = { index = "dsp" }

# The wheels attached to the GitHub release (.github/workflows/dsp-wheels.yml); never from PyPI.
[[tool.uv.index]]
name = "dsp"
url = "https://github.com/puppi3-music/puppi3s-dj-tools/releases/expanded_assets/dsp-v0.2.0"
format = "flat"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
