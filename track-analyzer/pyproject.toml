[project]
name = "dj-track-analyzer"
version = "0.1.0"
description = "Local music analysis for DJs: BPM, key/Camelot, genre, mood and Traktor colour, Traktor/Lexicon sync and an MCP server"
requires-python = ">=3.11,<3.12"  # PyAV 18 has no 3.10 wheels, TensorFlow 2.15 none for 3.12
license = "AGPL-3.0-only"
dependencies = [
    "mcp>=2.3,<3",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "mutagen>=1.47",
    "numpy<2",
    # MusicalKeyCNN's key and Cross-Key Analysis (keycnn.py, cka.py): the CQT and chroma the model was trained on.
    "librosa==0.10.2.post1",
    # The DSP (loudness, resampling, mel bands, key, BPM) in Rust (dsp/), prebuilt by CI, so no Rust needed.
    "track-analyzer-dsp==0.5.0",
    # Decoding with current FFmpeg (analysis.decode). Apple Silicon wheels need macOS 14.
    "av==18.1.0",
    # The model graphs (analysis.Graph, Head). On Apple Silicon and Windows `tensorflow` is an empty package
    # pulling in these, which uv's lock misses: name them.
    "tensorflow==2.15.0",
    "tensorflow-macos==2.15.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-intel==2.15.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Vocals and synths in a loop (cues.loop_parts): Demucs separates the loop's audio into stems. PyTorch, about 600 MB.
# `uv sync --extra stems`
stems = ["demucs==4.0.1"]

[dependency-groups]
# Essentia, only as the reference dsp/check.py compares the Rust code against (macOS and Linux x86_64).
# `uv sync --group check`
check = [
    "essentia-tensorflow==2.1b6.dev1177; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "essentia-tensorflow>2.1b6.dev1177; sys_platform == 'darwin' and platform_machine != 'arm64'",
    "essentia-tensorflow>2.1b6.dev1177; sys_platform == 'linux'",
]

[project.scripts]
dj-track-analyzer = "dj_track_analyzer.cli:main"

[tool.uv]
# Where the dsp wheels are built (.github/workflows/dsp-wheels.yml).
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
track-analyzer-dsp = { index = "dsp" }

# The wheels attached to the GitHub release (.github/workflows/dsp-wheels.yml); never from PyPI.
[[tool.uv.index]]
name = "dsp"
url = "https://github.com/puppi3-music/puppi3s-dj-tools/releases/expanded_assets/dsp-v0.5.0"
format = "flat"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
