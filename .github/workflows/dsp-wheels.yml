name: Build track-analyzer-dsp wheels

# Builds the Rust DSP module (track-analyzer/dsp) for every platform the analyzer supports, so nobody
# needs Rust installed. Every push that touches dsp/ builds and keeps the wheels as an artifact; a tag
# dsp-v<version> also attaches them to a GitHub release, where `uv sync` finds them.

on:
  push:
    branches: [main]
    paths: ["track-analyzer/dsp/**", ".github/workflows/dsp-wheels.yml"]
    tags: ["dsp-v*"]
  pull_request:
    paths: ["track-analyzer/dsp/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }    # Apple Silicon
          - { os: macos-15-intel, target: x86_64-apple-darwin } # Intel Mac
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          working-directory: track-analyzer/dsp
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: track-analyzer/dsp/dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/dsp-v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
