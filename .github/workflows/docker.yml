# The Docker test environment (track-analyzer/Dockerfile, target test): real models on a synthetic library,
# scripts/docker_smoke.py end to end, run as the last build step (target smoke). Builds only; nothing is published.
name: docker

on:
  push:
    branches: [main]
    paths: ["track-analyzer/**", ".github/workflows/docker.yml", "!track-analyzer/docs/**", "!track-analyzer/dsp/**"]
  pull_request:
    paths: ["track-analyzer/**", ".github/workflows/docker.yml", "!track-analyzer/docs/**", "!track-analyzer/dsp/**"]
  workflow_dispatch:

# A new push to the same pull request (or branch) cancels the smoke run still going for the previous one
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: track-analyzer
          target: smoke  # the smoke test runs as the build's last step (Dockerfile); a failure fails the build
          outputs: type=cacheonly  # nothing to export or load: only the cache is kept
          cache-from: type=gha
          # Only main saves to the cache; pull requests read main's. GitHub keeps 10 GB per repository and drops what
          # was used longest ago, and a rebuilt layer is a new copy (its bytes differ): with every pull request saving
          # its own ~2-3 GB, main's big layers (Python packages 1.5 GB, models 350 MB) were dropped, so every run
          # rebuilt them and saved yet more copies.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
