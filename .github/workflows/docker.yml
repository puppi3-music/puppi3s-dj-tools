# The Docker test environment (track-analyzer/Dockerfile, target test): real models on a synthetic library,
# scripts/docker_smoke.py end to end. Builds only; nothing is published.
name: docker

on:
  push:
    branches: [main]
    paths: ["track-analyzer/**", ".github/workflows/docker.yml", "!track-analyzer/docs/**", "!track-analyzer/dsp/**"]
  pull_request:
    paths: ["track-analyzer/**", "!track-analyzer/docs/**", "!track-analyzer/dsp/**"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: track-analyzer
          target: test
          tags: track-analyzer:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm --user 1000:1000 track-analyzer:test
