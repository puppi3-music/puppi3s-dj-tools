name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "track-analyzer/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site/track-analyzer
          cp site/index.html _site/index.html
          cp track-analyzer/docs/GUIDE.html _site/track-analyzer/index.html
          cp -R track-analyzer/docs/img _site/track-analyzer/img  # the guide's screenshots (img/… beside it, as in docs/)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
